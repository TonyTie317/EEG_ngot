# Sweetness EEG Study (Sucrose vs Sucralose) — configuration
# ==========================================================
# All output paths are resolved to absolute paths under sweetness_eeg/.

paths:
  raw_data: "data/datamoi"                         # relative to repo root
  behavior_xlsx: "doc/Đánh giá cảm quan - EEG 31.5.xlsx"
  figures: "figures"
  results: "results"
  reports: "reports"

preprocessing:
  sfreq: 100
  reference: "average"
  notch_freq: 49           # mains; < Nyquist (50 Hz). Low-pass at 45 Hz also removes mains.
  l_freq: 0.5              # high-pass (allows full delta 1–4 Hz)
  h_freq: 45              # low-pass
  ica:
    enabled: false         # 10 s tasting windows; ICA off by default (toggle to true)
    n_components: 15
    method: "picard"
    max_iter: 512
    random_state: 42
    auto_exclude_eog: true
    eog_threshold: 2.5

epoching:
  tmin: 0.0                # trial = the 10 s tasting/hold window
  tmax: 9.99              # 1000 samples @ 100 Hz
  baseline: null          # no clean pre-stimulus baseline within a continuous trial
  reject_uv: 1000         # per-trial peak-to-peak rejection (µV); headset baseline ~450–775µV

spectral:
  welch_seconds: 2.0      # Welch segment length
  welch_overlap: 0.5      # 50% overlap
  fmin: 1.0
  fmax: 45.0
  relative: true          # also compute relative band power (band / total 1–45 Hz)
  # time-resolved band power
  window_seconds: 1.0
  window_step: 0.5
  # aftertaste contrast windows (seconds within the 10 s trial)
  early_window: [0.0, 3.0]
  late_window: [6.0, 9.99]

tfr:
  fmin: 2.0
  fmax: 45.0
  n_freqs: 40
  n_cycles_factor: 0.5     # n_cycles = freqs * factor

stats:
  alpha: 0.05
  fdr_method: "fdr_bh"
  n_permutations: 1000
  random_state: 42

ml:
  random_state: 42
  tasks: ["substance", "intensity"]   # sucrose-vs-sucralose, and 3-way intensity
  models: ["logreg", "svm", "rf"]      # xgboost added automatically if available

dl:
  enabled: true
  models: ["eegnet", "shallowconvnet"]
  epochs: 80
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 15
  val_ratio: 0.2
  random_state: 42

logging:
  level: "INFO"
